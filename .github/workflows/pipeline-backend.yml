name: Emmaus Backend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - emmaus_api/**
      - docker/backend/**
      - .github/workflows/*-backend.yml

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: build docker image
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create local key files from secrets
        run: |
          mkdir -p emmaus_api/src/main/resources/local-only
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > emmaus_api/src/main/resources/local-only/private_key.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > emmaus_api/src/main/resources/local-only/public_key.pem

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: emmaus_api
          file: docker/backend/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/emmaus-api:latest

