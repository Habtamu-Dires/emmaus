server:
  port: 8088
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  tomcat:
    max-http-form-post-size: 5MB
    max-http-post-size: 5MB
spring:
  application:
    name: emmaus_api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emmaus_db}
    username: ${SPRING_DATASOURCE_USERNAME:hab}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never  # Flyway handles schema
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:haft.adu@gmail.com}
    password: ${MAIL_PASSWORD:something}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # Remove STARTTLS when using SSL on port 465
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000


# Modulith verification on startup
spring.modulith:
  verification:
    enabled: true
  detection-strategy: explicitly-annotated

# open api swagger produce json
springdoc:
  default-produces-media-type: application/json

app:
  security:
    jwt:
      access-token-expiration: 900000 # 15 minutes
      refresh-token-expiration: 604800000 # 7 days
  jwt-keys:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:/home/hab/workspace/mvp/project_intelligence_platform/pip_modules/src/main/resources/keys/local-only/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/home/hab/workspace/mvp/project_intelligence_platform/pip_modules/src/main/resources/keys/local-only/public_key.pem}
  cors:
    origins: ${ALLOWED_ORIGINS:http://some.com,http://localhost:4200}
  server:
    url: ${SERVER_URL:http://localhost:8088/api}
  email:
    from: ${MAIL_FROM:haft.adu@gamil.com}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}