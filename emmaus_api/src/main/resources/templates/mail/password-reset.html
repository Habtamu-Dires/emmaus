<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .card { background: #ffffff; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; }
        .reset-link {
            color: #1066c9;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Reset Your Password</h2>
    <p>Hello <span th:text="${userName}">User</span>,</p>
    <p>A password reset was requested for your account. Click the button below to set a new password:</p>
    <a th:href="${resetUrl}" class="reset-link">Reset Password</a>
    <p style="margin-top:20px; font-size:12px; color:#6b7280;">If you didn't request this, you can safely ignore this email.</p>
</div>
</body>
</html>
