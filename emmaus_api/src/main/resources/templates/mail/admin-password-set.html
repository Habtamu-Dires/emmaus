<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .card { background: #ffffff; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; }
        .alert { background: #fef3c7; color: #92400e; padding: 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>Welcome <span th:text="${userName}">User</span></h2>
    <p>Please use the following temporary password to login.</p>
    <div class="alert">Your temporary password: <span th:text="${temporaryPassword}">Pass123!</span></div>
    <p>Please log in and change your password immediately.</p>
</div>
</body>
</html>
