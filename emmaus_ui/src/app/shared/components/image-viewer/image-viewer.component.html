<div class="relative flex flex-col items-center justify-center bg-gray-950 rounded-2xl overflow-hidden shadow-2xl min-h-[400px] max-h-[80vh] group">
  <div (click)="onCancel()" class="w-full cursor-pointer flex justify-end p-2 z-9000 text-xl text-red-800"> 
    X
  </div>
  <div class="w-full h-full overflow-auto flex items-center justify-center cursor-move p-4 scrollbar-hide">
    <img 
      [src]="data.url" 
      alt="Payment Slip"
      class="max-w-full transition-transform duration-200 ease-out shadow-lg rounded-sm"
      [style.transform]="'scale(' + zoomLevel + ')'"
      (wheel)="onMouseWheel($event)" />
  </div>

  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-1 p-1.5 bg-black/60 backdrop-blur-md border border-white/20 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300">
    
    <button (click)="zoomOut()" 
            class="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"
            title="Zoom Out">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
      </svg>
    </button>

    <div class="px-3 min-w-[60px] text-center">
      <span class="text-xs font-bold text-white tabular-nums">
        {{ (zoomLevel * 100).toFixed(0) }}%
      </span>
    </div>

    <button (click)="zoomIn()" 
            class="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"
            title="Zoom In">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
      </svg>
    </button>

    <div class="w-px h-4 bg-white/20 mx-1"></div>

    <button (click)="resetZoom()" 
            class="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"
            title="Reset">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>

    <a [href]="data.url" target="_blank" download
       class="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"
       title="Open Original">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    </a>
  </div>
</div>
