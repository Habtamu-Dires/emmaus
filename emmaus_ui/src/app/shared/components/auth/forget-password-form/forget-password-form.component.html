<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Forgot Password?
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Enter your email.
      </p>
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="onReset()" class="space-y-6">
      <div>
        <app-label>Email <span class="text-error-500">*</span></app-label>
        <input type="text" formControlName="email" placeholder="Enter your email" 
             class="w-full rounded-lg dark:text-gray-100 p-2 border-2 dark:bg-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500"
              [ngClass]="isInvalid('email') ? 'border-error-500' : 'border-gray-300 dark:border-gray-600'"
          >
      </div>
       <button type="submit"
          [disabled]="isProcessing"
          class="p-2 rounded-xl w-full bg-brand-500 hover:bg-brand-800 text-white cursor-pointer disabled:cursor-not-allowed"
        >
           Reset Password
        </button>

      <div class="text-center cursor-pointer">
        <a
          (click)="backToLogin()"
          class="text-sm font-medium text-brand-500 hover:text-brand-600 dark:text-brand-400"
        >
          Back to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
