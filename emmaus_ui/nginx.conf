# nginx.conf
worker_processes auto; # 'auto' is safer for production to utilize available CPU cores

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Map .mjs files correctly for Angular
    types {
        application/javascript mjs;
    }

    server {
        listen 80;
        server_name localhost;
        
        # Define root at the server level so all locations inherit it safely
        root /usr/share/nginx/html;

        # 1. FORCE NO-CACHE ON INDEX.HTML
        # Ensures browsers always ask for the newest version of your app
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
        }

        # 2. THE WHITE-SCREEN FIX: ASSET HANDLING
        # Heavily cache JS/CSS/Images. If missing, return 404 (NEVER index.html)
        location ~* \.(?:css|js|mjs|woff2?|eot|ttf|otf|svg|gif|png|jpe?g|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            
            # This prevents the white screen. It fails cleanly if the old JS file is gone.
            try_files $uri =404; 
        }

        # 3. ANGULAR ROUTING FALLBACK
        # Handles normal navigation (e.g., users directly visiting /dashboard)
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Prevent caching of route paths
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }

    }
}